<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu Marina</title>
<style>
  :root { --accent:#d9822b; --bg:#faf6f0; --card:#fff; --ink:#2b2b2b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:150px; }
  header { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #eadfd0; padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; color:var(--accent); }
  #q { flex:1; min-width:160px; padding:8px 12px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
  main { max-width:1200px; margin:0 auto; padding:0 16px; }
  h2 { color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:4px; margin:28px 0 12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  label.card { background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 4px #0002; cursor:pointer; position:relative; border:3px solid transparent; display:block; }
  label.card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#eee; }
  .info { padding:8px 10px 10px; }
  .num { display:inline-block; background:var(--accent); color:#fff; font-weight:700; border-radius:6px; padding:1px 8px; margin-right:6px; }
  .name { font-weight:600; }
  .price { color:#777; font-size:13px; margin-top:4px; }
  .ing { font-size:13px; color:#8a6a45; margin-top:4px; line-height:1.3; }
  .star { color:#d22; }
  input[type=checkbox] { position:absolute; top:10px; right:10px; width:26px; height:26px; accent-color:var(--accent); cursor:pointer; }
  .qty { display:none; align-items:center; gap:10px; margin-top:8px; }
  label.card.sel .qty { display:flex; }
  .qty button { width:32px; height:32px; padding:0; font-size:18px; }
  .qty b { min-width:24px; text-align:center; }
  label.card.sel { border-color:var(--accent); background:#fff4e6; }
  footer { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:2px solid var(--accent); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; z-index:6; max-height:60vh; overflow-y:auto; }
  #out { flex:1; min-width:200px; height:64px; padding:8px; font:14px monospace; border:1px solid #ccc; border-radius:8px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; }
  button.sec { background:#888; }
  .count { font-weight:700; }
  .order-summary { flex:1 0 100%; display:flex; align-items:center; gap:16px; min-width:0; flex-wrap:wrap; }
  .order-status { flex:0 1 340px; display:flex; align-items:center; gap:12px; color:#533b27; }
  .order-status svg { flex:none; width:52px; height:64px; }
  .order-status strong { font-size:18px; }
  .order-status p { margin:3px 0 0; font-size:14px; }
  .order-status[data-level="high"] { color:#8a360f; }
  .order-status[data-level="high"] .order-message { font-weight:700; }
  .order-status[data-level="high"] svg { color:#b94b18; }
  .order-status small { display:block; margin-top:3px; font-size:12px; }
  .order-tray { flex:1 1 280px; min-width:0; }
  .order-items { display:flex; gap:12px; overflow-x:auto; padding:4px 2px 8px; margin:0; list-style:none; }
  .order-item { flex:0 0 136px; min-width:0; position:relative; }
  .order-item img { display:block; width:136px; height:76px; object-fit:cover; border-radius:6px; }
  .order-item-name { display:block; margin:5px 0; font-size:13px; line-height:1.3; color:#533b27; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .order-item .remove { position:absolute; top:0; right:0; min-width:32px; height:32px; padding:0; background:#fff; color:#85320d; border:1px solid #85320d; font-weight:700; }
  .order-controls { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .order-controls button { width:36px; height:32px; padding:0; font-size:18px; background:#9b4b10; }
  .order-controls output { font-weight:700; color:#533b27; }
  button:disabled { background:#eee; color:#666; cursor:not-allowed; }
  button:focus-visible { outline:3px solid #533b27; outline-offset:2px; }
  .order-empty { margin:0; font-size:14px; color:#694a30; }
  .order-empty[hidden], .order-items[hidden] { display:none; }
</style>
</head>
<body>
<header>
  <h1>Menu Marina</h1>
  <input id="q" type="search" placeholder="Cerca per numero o nome…">
  <button id="who" class="sec"></button>
</header>
<div id="nameDlg" style="display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center">
  <form id="nameForm" style="background:#fff;padding:24px;border-radius:12px;display:flex;flex-direction:column;gap:12px;width:min(90vw,340px)">
    <h2 style="margin:0;border:0">Come ti chiami?</h2>
    <input id="nameIn" required maxlength="40" placeholder="Nome" style="padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px">
    <button type="submit">Entra</button>
  </form>
</div>
<main id="main"></main>
<footer>
  <div class="order-summary">
  <div id="orderStatus" class="order-status" data-level="low" role="status" aria-live="polite" aria-atomic="true">
    <svg viewBox="0 0 80 96" fill="none" aria-hidden="true" focusable="false">
      <circle cx="40" cy="15" r="11" fill="#f3cfab" stroke="currentColor" stroke-width="2"/>
      <path d="M35 17 Q40 22 45 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36" cy="12" r="1.5" fill="currentColor"/>
      <circle cx="44" cy="12" r="1.5" fill="currentColor"/>
      <path d="M28 34 L18 55 M52 34 L62 55 M33 72 L30 90 M47 72 L50 90" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <path id="orderBody" d="M31 30 Q40 26 49 30 L50 72 Q40 76 30 72 Z" fill="#f4d7ae" stroke="currentColor" stroke-width="2"/>
    </svg>
    <div>
      <strong><span class="count" id="count">0</span> <span id="countLabel">piatti ordinati</span></strong>
      <p id="orderMessage" class="order-message">Il menu ti aspetta!</p>
      <small>Il totale comprende le quantità di ciascun piatto.</small>
    </div>
  </div>
      <div class="order-tray" role="region" aria-label="Piatti ordinati">
        <p id="orderEmpty" class="order-empty">Seleziona un piatto: lo ritroverai qui con foto e quantità.</p>
        <ul id="orderItems" class="order-items" aria-label="Riepilogo dei piatti ordinati" hidden></ul>
    </div>
  </div>
  <textarea id="out" readonly placeholder="Numeri selezionati (CSV)"></textarea>
  <button id="copy">Copia</button>
  <button id="clear" class="sec">Azzera</button>
</footer>
<script src="items.js"></script>
<script>
let saved = JSON.parse(localStorage.getItem('marinaSel') || '{}');
if (Array.isArray(saved)) saved = Object.fromEntries(saved.map(n => [n, 1]));
const sel = new Map(Object.entries(saved).map(([k, v]) => [+k, +v]));
const main = document.getElementById('main'), out = document.getElementById('out');
const cats = [...new Set(ITEMS.map(i => i.cat))];
const cards = {};

for (const c of cats) {
  const sec = document.createElement('section');
  sec.innerHTML = `<h2>${c}</h2><div class="grid"></div>`;
  const grid = sec.querySelector('.grid');
  for (const it of ITEMS.filter(i => i.cat === c)) {
    const l = document.createElement('label');
    l.className = 'card';
    l.innerHTML = `<input type="checkbox" value="${it.n}">
      <img src="${it.img}" alt="${it.name}" loading="lazy">
      <div class="info"><span class="num">${it.n}</span><span class="name">${it.name}</span>${it.star ? ' <span class="star" title="Una volta a persona">★</span>' : ''}${it.spicy ? ' <span title="Piccante">🌶️</span>' : ''}
      ${it.ing ? `<div class="ing">${it.ing}</div>` : ''}
      <div class="price">€ ${it.price.toFixed(2).replace('.', ',')}</div>
      <div class="qty"><button type="button" class="minus">−</button><b>1</b><button type="button" class="plus">+</button></div></div>`;
    const cb = l.querySelector('input'), qb = l.querySelector('.qty b');
    const render = () => {
      const q = sel.get(it.n) || 0;
      cb.checked = q > 0;
      qb.textContent = q;
      l.classList.toggle('sel', q > 0);
      l.querySelector('.plus').disabled = q >= (it.star ? 1 : 99);
    };
    const setQty = q => {
      q = it.star ? Math.min(q, 1) : Math.min(q, 99);
      q > 0 ? sel.set(it.n, q) : sel.delete(it.n);
      render(); update();
    };
    cb.addEventListener('change', () => setQty(cb.checked ? 1 : 0));
    l.querySelector('.plus').onclick = e => { e.preventDefault(); setQty((sel.get(it.n) || 0) + 1); };
    l.querySelector('.minus').onclick = e => { e.preventDefault(); setQty((sel.get(it.n) || 0) - 1); };
    render();
    cards[it.n] = { el: l, render, setQty, text: (it.n + ' ' + it.name + ' ' + it.cat).toLowerCase(), sec };
    grid.appendChild(l);
  }
  main.appendChild(sec);
}

const orderItems = document.getElementById('orderItems');
const orderRows = new Map();
function renderOrder(list) {
  const activeRow = document.activeElement.closest('[data-dish]');
  const activeIndex = activeRow ? [...orderItems.children].indexOf(activeRow) : -1;
  for (const [n, row] of orderRows) {
    if (!sel.has(n)) {
      row.remove();
      orderRows.delete(n);
    }
  }
  list.forEach(([n, q], index) => {
    let row = orderRows.get(n);
    if (!row) {
      const it = ITEMS.find(item => item.n === n);
      row = document.createElement('li');
      row.className = 'order-item';
      row.dataset.dish = n;
      row.innerHTML = `<img src="${it.img}" alt="${it.name}">
        <button type="button" class="remove" data-action="remove" aria-label="Rimuovi ${n}: ${it.name}">X</button>
        <span class="order-item-name" title="${n} · ${it.name}">${n} · ${it.name}</span>
        <div class="order-controls">
          <button type="button" data-action="minus" aria-label="Togli una porzione di ${n}: ${it.name}">−</button>
          <output aria-label="Quantità di ${n}: ${it.name}"></output>
          <button type="button" data-action="plus" aria-label="Aggiungi una porzione di ${n}: ${it.name}" title="${it.star ? 'Massimo una porzione a persona' : 'Aggiungi una porzione'}">+</button>
        </div>`;
      orderRows.set(n, row);
    }
    row.querySelector('output').textContent = q;
    row.querySelector('[data-action="plus"]').disabled = q >= (ITEMS.find(it => it.n === n).star ? 1 : 99);
    if (orderItems.children[index] !== row) orderItems.insertBefore(row, orderItems.children[index] || null);
  });
  orderItems.hidden = list.length === 0;
  document.getElementById('orderEmpty').hidden = list.length > 0;
  if (activeRow && !activeRow.isConnected) {
    const next = orderItems.children[Math.min(activeIndex, list.length - 1)];
    (next ? next.querySelector('button') : document.getElementById('clear')).focus({ preventScroll:true });
  }
}
orderItems.addEventListener('click', e => {
  const button = e.target.closest('button[data-action]');
  if (!button) return;
  const n = Number(button.closest('[data-dish]').dataset.dish);
  const q = sel.get(n) || 0;
  cards[n].setQty(button.dataset.action === 'remove' ? 0 : q + (button.dataset.action === 'plus' ? 1 : -1));
});

function update() {
  const list = [...sel].sort((a, b) => a[0] - b[0]);
  renderOrder(list);
  out.value = (userName ? userName + ': ' : '') + list.map(([n, q]) => q > 1 ? n + 'x' + q : n).join(',');
  const total = list.reduce((s, [, q]) => s + q, 0);
  const level = total > 16 ? 'high' : total >= 12 ? 'medium' : 'low';
  document.getElementById('count').textContent = total;
  document.getElementById('countLabel').textContent = total === 1 ? 'piatto ordinato' : 'piatti ordinati';
  document.getElementById('orderStatus').dataset.level = level;
  document.getElementById('orderMessage').textContent = total === 0
    ? 'Il menu ti aspetta!'
    : level === 'high'
      ? 'Probabilmente stai ordinando troppo. Anche le bacchette chiedono una pausa!'
      : level === 'medium'
        ? 'La tavola si riempie: buon appetito!'
        : 'Un piatto alla volta, si comincia!';
  const bodies = {
    low: 'M31 30 Q40 26 49 30 L50 72 Q40 76 30 72 Z',
    medium: 'M27 30 Q40 26 53 30 Q61 50 56 72 Q40 79 24 72 Q19 50 27 30 Z',
    high: 'M25 30 Q40 25 55 30 C72 42 79 66 66 76 Q40 88 14 76 C1 66 8 42 25 30 Z'
  };
  document.getElementById('orderBody').setAttribute('d', bodies[level]);
  localStorage.setItem('marinaSel', JSON.stringify(Object.fromEntries(sel)));
}
const footer = document.querySelector('footer');
const resizeFooter = () => {
  document.body.style.paddingBottom = (footer.getBoundingClientRect().height + 24) + 'px';
};
new ResizeObserver(resizeFooter).observe(footer);
resizeFooter();
document.getElementById('copy').onclick = () => { out.select(); navigator.clipboard.writeText(out.value); };
document.getElementById('clear').onclick = () => {
  sel.clear();
  Object.values(cards).forEach(c => c.render());
  update();
};
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  Object.values(cards).forEach(c => c.el.style.display = c.text.includes(q) ? '' : 'none');
  document.querySelectorAll('section').forEach(s => {
    s.style.display = [...s.querySelectorAll('label.card')].some(l => l.style.display !== 'none') ? '' : 'none';
  });
});
let userName = localStorage.getItem('marinaName') || '';
const who = document.getElementById('who'), dlg = document.getElementById('nameDlg'), nameIn = document.getElementById('nameIn');
function setName(n) {
  userName = n.trim();
  localStorage.setItem('marinaName', userName);
  who.textContent = userName ? '👤 ' + userName + ' (cambia)' : '';
  update();
}
function askName() { nameIn.value = userName; dlg.style.display = 'flex'; nameIn.focus(); }
document.getElementById('nameForm').onsubmit = e => {
  e.preventDefault();
  if (!nameIn.value.trim()) return;
  setName(nameIn.value);
  dlg.style.display = 'none';
};
who.onclick = askName;
setName(userName);
if (!userName) askName();
</script>
</body>
</html>
