<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unisci ordini · Menu Marina</title>
<style>
  @font-face { font-family:Kalam; src:url("fonts/Kalam-Regular.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
  @font-face { font-family:"Lilita One"; src:url("fonts/LilitaOne-Regular.ttf") format("truetype"); font-style:normal; font-weight:400; font-display:swap; }
  * { box-sizing:border-box; }
  body { margin:0; background:#faf6f0; color:#533b27; font-family:system-ui,Segoe UI,Arial,sans-serif; line-height:1.5; }
  header, main { max-width:860px; margin:auto; padding:20px; }
  header { border-bottom:1px solid #d9c8b7; }
  a { color:#85400d; }
  h1 { margin:12px 0 0; font-size:30px; line-height:1.2; }
  h2 { margin:0 0 12px; font-size:24px; }
  p { margin:8px 0 16px; }
  label { display:block; font-weight:600; margin-bottom:8px; }
  textarea { display:block; width:100%; min-height:220px; resize:vertical; border:1px solid #ad8c6c; border-radius:8px; padding:12px; font:16px/1.6 monospace; background:#fff; color:#2b2b2b; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin:16px 0; }
  button { min-height:44px; padding:10px 18px; border:1px solid #9b4b10; border-radius:8px; background:#9b4b10; color:#fff; cursor:pointer; font:600 16px system-ui,Segoe UI,Arial,sans-serif; }
  button.secondary { background:#fff; color:#754315; }
  button:disabled { background:#eee; border-color:#ccc; color:#666; cursor:not-allowed; }
  button:focus-visible, a:focus-visible, textarea:focus-visible { outline:3px solid #754315; outline-offset:3px; }
  #errors { padding:12px; border:1px solid #a12515; color:#921f13; background:#fff; overflow-wrap:anywhere; }
  #errors p { margin:4px 0; }
  #result { margin-top:28px; }
  #tableNumber { padding:8px; max-width:180px; font:16px system-ui; border:1px solid #ad8c6c; border-radius:6px; }
  .sheet-preview { display:none; }
  #mergedList { min-height:90px; }
  #copyStatus:empty, #notice:empty { display:none; }
  .order-sheet { width:105mm; height:148mm; padding:7mm 5mm 4mm; margin:0 auto 20px; background:#fff; color:#000; font-family:Arial,sans-serif; display:flex; flex-direction:column; border:1px solid #ccc; }
  .sheet-heading { display:flex; justify-content:flex-end; align-items:center; gap:5mm; margin-bottom:1.5mm; }
  .sheet-heading h3 { margin:0; font-family:"Lilita One",sans-serif; font-size:16px; font-weight:400; white-space:nowrap; }
  .sheet-table { font-family:Kalam,"Segoe Print",cursive; font-size:15px; max-width:32mm; overflow-wrap:anywhere; line-height:1.2; }
  .sheet-rule { text-align:center; font-family:"Lilita One",sans-serif; font-size:9px; font-weight:400; margin:0 0 1.5mm; line-height:1.2; }
  .sheet-grids { display:grid; grid-template-columns:1fr 1fr; gap:1.5mm; flex:1; min-height:0; }
  .sheet-grids table { width:100%; height:100%; border-collapse:collapse; table-layout:fixed; color:#000; }
  .sheet-grids th, .sheet-grids td { border:1px solid #000; text-align:center; padding:0 1px; }
  .sheet-grids th { height:6mm; font-family:"Lilita One",sans-serif; font-size:7px; font-weight:400; white-space:nowrap; }
  .sheet-grids td { font-family:Kalam,"Segoe Print",cursive; font-size:15px; font-weight:400; line-height:1; }
  .sheet-grids tbody tr { height:6mm; }
  .sheet-note { margin:2mm 0 0; text-align:center; font-family:"Lilita One",sans-serif; font-size:9px; font-weight:400; line-height:1.2; }
  .sheet-page { margin:1mm 0 0; text-align:right; font-size:7px; }
  #summary { font-weight:600; }
  [hidden] { display:none !important; }
  @media (max-width:600px) {
    header, main { padding:16px; }
    h1 { font-size:26px; }
    .actions button { flex:1 1 130px; }
  }
  @page { size:A4 portrait; margin:10mm; }
  @media print {
    body { background:#fff; color:#000; }
    header, #editor { display:none; }
    main { padding:0; max-width:none; }
    #result { margin:0; }
    #resultTitle, #summary, .result-list { display:none; }
    .sheet-preview { display:block; overflow:visible; }
    .order-sheet { border:0; margin:0 auto; break-after:page; break-inside:avoid; }
    .order-sheet:last-child { break-after:auto; }
  }
</style>
</head>
<body>
<header>
  <a href="index.html">← Torna al menu</a>
  <h1>Unisci gli ordini del gruppo</h1>
</header>
<main>
  <section id="editor" aria-label="Inserimento delle liste">
    <p>Incolla una lista per persona, su righe separate. I nomi sono facoltativi; le quantità dello stesso piatto vengono sommate.</p>
    <form id="mergeForm">
      <label for="lists">Liste dei partecipanti</label>
      <textarea id="lists" required spellcheck="false" placeholder="Mario: 2x3,5,101x2&#10;Anna: 2,5x2,60"></textarea>
      <label for="tableNumber">Numero tavolo (facoltativo)</label>
      <input id="tableNumber" type="text" maxlength="12" placeholder="Es. 12">
      <div class="actions">
        <button type="submit">Unisci liste</button>
        <button id="print" type="button" disabled>Stampa / Salva PDF</button>
        <button id="reset" type="button" class="secondary">Azzera</button>
      </div>
    </form>
    <div id="errors" role="alert" hidden></div>
    <p id="notice" role="status"></p>
  </section>
  <section id="result" aria-labelledby="resultTitle" hidden>
    <h2 id="resultTitle">Lista unificata</h2>
    <p id="summary"></p>
    <div class="result-list">
      <label for="mergedList">Numeri dei piatti e quantità totali</label>
      <textarea id="mergedList" readonly></textarea>
      <div class="actions"><button id="copyMerged" type="button">Copia lista</button></div>
      <p id="copyStatus" role="status"></p>
    </div>
    <div id="sheets" class="sheet-preview"></div>
  </section>
</main>
<script src="items.js"></script>
<script>
const lists = document.getElementById('lists');
const result = document.getElementById('result');
const printButton = document.getElementById('print');
const errors = document.getElementById('errors');
const notice = document.getElementById('notice');

function mergeOrders(text) {
  const totals = new Map();
  const problems = [];
  let people = 0;
  for (const [index, raw] of text.split(/\r?\n/).entries()) {
    const line = raw.trim();
    if (!line) continue;
    people++;
    const colon = line.indexOf(':');
    const numbers = colon >= 0 ? line.slice(colon + 1) : line;
    const person = new Map();
    for (const token of numbers.split(/[,;]/)) {
      const match = token.trim().match(/^(\d+)(?:\s*[x×]\s*(\d+))?$/i);
      if (!match) {
        problems.push(`Riga ${index + 1}: voce non valida «${token.trim() || '(vuota)'}». Usa ad esempio 2x3,5.`);
        continue;
      }
      const n = Number(match[1]), q = Number(match[2] || 1);
      if (!ITEMS.some(item => item.n === n)) {
        problems.push(`Riga ${index + 1}: il piatto ${n} non esiste nel menu.`);
        continue;
      }
      const quantity = (person.get(n) || 0) + q;
      if (!Number.isSafeInteger(q) || q < 1 || quantity > 99) {
        problems.push(`Riga ${index + 1}: la quantità del piatto ${n} deve essere tra 1 e 99.`);
        continue;
      }
      person.set(n, quantity);
    }
    for (const [n, q] of person) totals.set(n, (totals.get(n) || 0) + q);
  }
  if (!people) problems.push('Incolla almeno una lista di piatti.');
  return { people, totals:[...totals].sort((a, b) => a[0] - b[0]), problems };
}

function invalidate(message) {
  result.hidden = true;
  printButton.disabled = true;
  notice.textContent = message;
  errors.hidden = true;
  errors.replaceChildren();
  document.getElementById('mergedList').value = '';
  document.getElementById('copyStatus').textContent = '';
}
lists.addEventListener('input', () => invalidate('Lista modificata: premi «Unisci liste» per aggiornare la stampa.'));
document.getElementById('tableNumber').addEventListener('input', () => {
  document.querySelectorAll('.sheet-table').forEach(el => {
    el.textContent = 'N. TA ' + (document.getElementById('tableNumber').value.trim() || '______');
  });
});
function renderSheets(totals) {
  const sheets = document.getElementById('sheets');
  sheets.replaceChildren();
  const rowsPerColumn = 17;
  const pageSize = rowsPerColumn * 2;
  const pages = Math.ceil(totals.length / pageSize);
  for (let page = 0; page < pages; page++) {
    const sheet = document.createElement('article');
    sheet.className = 'order-sheet';
    sheet.setAttribute('aria-label', `Modulo ordine, foglio ${page + 1} di ${pages}`);
    sheet.innerHTML = `<div class="sheet-heading"><h3>MARINA SUSHI</h3><span class="sheet-table"></span></div>
      <p class="sheet-rule">Si possono ordinare al max 7 piatti a testa ad ogni turno</p>
      <div class="sheet-grids"></div>
      <p class="sheet-note">Esclusi dal menù: dolci, bevande, caffè</p>`;
    sheet.querySelector('.sheet-table').textContent = 'N. TA ' + (document.getElementById('tableNumber').value.trim() || '______');
    for (let column = 0; column < 2; column++) {
      const table = document.createElement('table');
      table.setAttribute('aria-label', `Piatti, colonna ${column + 1}`);
      table.innerHTML = '<thead><tr><th scope="col">NUMERO PIATTO</th><th scope="col">QUANTITÀ / PORZIONI</th></tr></thead><tbody></tbody>';
      for (let row = 0; row < rowsPerColumn; row++) {
        const entry = totals[page * pageSize + column * rowsPerColumn + row];
        const tr = document.createElement('tr');
        for (let cell = 0; cell < 2; cell++) {
          const td = document.createElement('td');
          td.textContent = entry ? entry[cell] : '';
          tr.append(td);
        }
        table.querySelector('tbody').append(tr);
      }
      sheet.querySelector('.sheet-grids').append(table);
    }
    if (pages > 1) {
      const counter = document.createElement('p');
      counter.className = 'sheet-page';
      counter.textContent = `Foglio ${page + 1} di ${pages}`;
      sheet.append(counter);
    }
    sheets.append(sheet);
  }
}
document.getElementById('mergeForm').onsubmit = e => {
  e.preventDefault();
  invalidate('');
  const merged = mergeOrders(lists.value);
  if (merged.problems.length) {
    for (const problem of merged.problems) {
      const p = document.createElement('p');
      p.textContent = problem;
      errors.append(p);
    }
    errors.hidden = false;
    notice.textContent = 'Correggi le righe indicate: nessuna lista parziale è stata generata.';
    return;
  }
  renderSheets(merged.totals);
  document.getElementById('mergedList').value = merged.totals.map(([n, q]) => q > 1 ? `${n}x${q}` : String(n)).join(',');
  const total = merged.totals.reduce((sum, [, q]) => sum + q, 0);
  document.getElementById('summary').textContent = `${merged.people} liste · ${merged.totals.length} piatti diversi · ${total} porzioni totali`;
  result.hidden = false;
  printButton.disabled = false;
  notice.textContent = '';
};
document.getElementById('copyMerged').onclick = async () => {
  const field = document.getElementById('mergedList');
  field.focus();
  field.select();
  try {
    await navigator.clipboard.writeText(field.value);
    document.getElementById('copyStatus').textContent = 'Lista copiata.';
  } catch (error) {
    console.error('Copia della lista non riuscita:', error);
    document.getElementById('copyStatus').textContent = 'Copia automatica non disponibile. La lista è selezionata: copiala dal menu del dispositivo o con Ctrl+C.';
  }
};
printButton.onclick = async () => {
  if (printButton.disabled) return;
  try {
    const fonts = await Promise.all([
      document.fonts.load('15px Kalam', '0123456789'),
      document.fonts.load('16px "Lilita One"', 'MARINA SUSHI')
    ]);
    if (fonts.some(loaded => !loaded.length)) throw new Error('Carattere non disponibile');
    window.print();
  } catch (error) {
    console.error('Caricamento del carattere di stampa non riuscito:', error);
    notice.textContent = 'Impossibile caricare i caratteri del modulo. Ricarica la pagina e riprova a stampare.';
  }
};
document.getElementById('reset').onclick = () => {
  lists.value = '';
  invalidate('');
  lists.focus();
};
</script>
</body>
</html>
